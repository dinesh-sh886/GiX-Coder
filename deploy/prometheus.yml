global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "gix-coder-local"
    environment: "development"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "gix-coder-services"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - gix-coder
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # Local development scrape configs
  - job_name: "gateway"
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: "gateway"
          environment: "development"

  - job_name: "harness"
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          service: "harness"
          environment: "development"

  - job_name: "sandbox"
    static_configs:
      - targets: ["host.docker.internal:9093"]
        labels:
          service: "sandbox"
          environment: "development"

  - job_name: "router"
    static_configs:
      - targets: ["host.docker.internal:9094"]
        labels:
          service: "router"
          environment: "development"

  - job_name: "workflow"
    static_configs:
      - targets: ["host.docker.internal:9095"]
        labels:
          service: "workflow"
          environment: "development"

  - job_name: "policy"
    static_configs:
      - targets: ["host.docker.internal:9096"]
        labels:
          service: "policy"
          environment: "development"

  - job_name: "audit"
    static_configs:
      - targets: ["host.docker.internal:9097"]
        labels:
          service: "audit"
          environment: "development"
