apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gix-coder

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment-gateway.yaml
  - deployment-harness.yaml
  - deployment-sandbox.yaml
  - deployment-router.yaml
  - deployment-workflow.yaml
  - deployment-policy.yaml
  - deployment-audit.yaml
  - service-gateway.yaml
  - service-harness.yaml
  - service-sandbox.yaml
  - service-router.yaml
  - service-workflow.yaml
  - service-policy.yaml
  - service-audit.yaml
  - ingress.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: gix-coder
  app.kubernetes.io/part-of: gix-coder
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/version: "0.1.0"
