apiVersion: v1
kind: Secret
metadata:
  name: gix-coder-secrets
  namespace: gix-coder
type: Opaque
stringData:
  # These values should be replaced by the overlay with actual secrets
  # or injected via Vault CSI driver / External Secrets Operator

  # Database
  POSTGRES_PASSWORD: "CHANGE_ME"

  # Redis
  REDIS_PASSWORD: "CHANGE_ME"

  # Vault
  VAULT_TOKEN: "CHANGE_ME"

  # JWT
  JWT_SIGNING_KEY: "CHANGE_ME"
  JWT_VERIFICATION_KEY: "CHANGE_ME"
  JWT_ISSUER: "gix-coder"
  JWT_AUDIENCE: "gix-coder-api"

  # GitHub
  GITHUB_APP_ID: "CHANGE_ME"
  GITHUB_PRIVATE_KEY: "CHANGE_ME"
  GITHUB_WEBHOOK_SECRET: "CHANGE_ME"

  # Model Providers
  OPENAI_API_KEY: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"
  OLLAMA_HOST: "http://ollama:11434"

  # MCP Registry
  MCP_REGISTRY_URL: "https://registry.mcp.example.com"
  MCP_API_KEY: "CHANGE_ME"

  # TLS
  TLS_CERT: "CHANGE_ME"
  TLS_KEY: "CHANGE_ME"
