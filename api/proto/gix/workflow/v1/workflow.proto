syntax = "proto3";

package gix.workflow.v1;

option go_package = "github.com/gix-coder/gix-coder/api/proto/gix/workflow/v1;workflowv1";

import "api/proto/gix/shared/v1/common.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

service WorkflowService {
  rpc StartExecution(StartExecutionRequest) returns (StartExecutionResponse) {
    option (google.api.http) = {
      post: "/workflows/executions"
      body: "*"
    };
  }
  
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse) {
    option (google.api.http) = {
      get: "/workflows/executions/{execution_id}"
    };
  }
  
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse) {
    option (google.api.http) = {
      post: "/workflows/executions/{execution_id}:cancel"
      body: "*"
    };
  }
  
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse) {
    option (google.api.http) = {
      get: "/workflows/executions"
    };
  }
}

message StartExecutionRequest {
  string workflow_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  WorkflowDefinition workflow = 2;
  map<string, string> input = 3;
  repeated gix.shared.v1.CapabilityGrantRequest capabilities = 4;
  string idempotency_key = 5 [
    (buf.validate.field).string.max_len = 128
  ];
}

message WorkflowDefinition {
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  string version = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  repeated WorkflowStep steps = 3 [
    (buf.validate.field).repeated.min_items = 1
  ];
  int64 timeout_seconds = 4 [
    (buf.validate.field).int64.gte = 0
  ];
  map<string, string> metadata = 5;
}

message WorkflowStep {
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  string type = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  string action = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  map<string, string> input = 4;
  map<string, string> output = 5;
  string condition = 6 [
    (buf.validate.field).string.max_len = 512
  ];
  int64 timeout_seconds = 7 [
    (buf.validate.field).int64.gte = 0
  ];
  RetryPolicy retry = 8;
  string on_failure = 9 [
    (buf.validate.field).string.max_len = 128
  ];
}

message RetryPolicy {
  int32 max_attempts = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 10
  ];
  int64 interval_seconds = 2 [
    (buf.validate.field).int64.gte = 0
  ];
  double backoff = 3 [
    (buf.validate.field).double.gte = 1.0
  ];
  int64 max_interval_seconds = 4 [
    (buf.validate.field).int64.gte = 0
  ];
}

message StartExecutionResponse {
  string execution_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  string status = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  string error_code = 3 [
    (buf.validate.field).string.max_len = 64
  ];
  string error_message = 4 [
    (buf.validate.field).string.max_len = 512
  ];
}

message GetExecutionRequest {
  string execution_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message GetExecutionResponse {
  ExecutionRecord execution = 1;
}

message CancelExecutionRequest {
  string execution_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message CancelExecutionResponse {
  bool success = 1;
  string message = 2 [
    (buf.validate.field).string.max_len = 256
  ];
}

message ExecutionRecord {
  string execution_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  string workflow_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  string workflow_type = 3 [
    (buf.validate.field).string.max_len = 64
  ];
  string status = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  map<string, string> input = 5;
  map<string, string> output = 6;
  string error_code = 7 [
    (buf.validate.field).string.max_len = 64
  ];
  string error_message = 8 [
    (buf.validate.field).string.max_len = 512
  ];
  int64 started_at = 9 [
    (buf.validate.field).int64.gt = 0
  ];
  int64 completed_at = 10 [
    (buf.validate.field).int64.gte = 0
  ];
  string correlation_id = 11 [
    (buf.validate.field).string.max_len = 128
  ];
  string tenant_id = 12 [
    (buf.validate.field).string.max_len = 128
  ];
}

message ListExecutionsRequest {
  string workflow_id = 1 [
    (buf.validate.field).string.max_len = 128
  ];
  string status = 2 [
    (buf.validate.field).string.max_len = 32
  ];
  gix.shared.v1.PaginationRequest pagination = 3;
  string tenant_id = 4 [
    (buf.validate.field).string.max_len = 128
  ];
}

message ListExecutionsResponse {
  repeated ExecutionRecord executions = 1;
  gix.shared.v1.PaginationResponse pagination = 2;
}